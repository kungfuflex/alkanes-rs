[package]
name = "alkanes-support"
# Pinned, not workspace: this crate is in the indexer wasm's dependency graph, and the
# package version feeds rustc's -C metadata, so bumping it changes alkanes.wasm bytes.
# It moves only with an indexer release (see the workspace [workspace.package] note).
version = "3.0.0-rc.3"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
protorune-support = { workspace = true }
metashrew-support = { workspace = true }
bitcoin = { workspace = true }
serde = "1.0.213"
flate2 = "1.0.34"
prost = { workspace = true }
prost-types = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
prost-build = { workspace = true }
hex = { workspace = true }