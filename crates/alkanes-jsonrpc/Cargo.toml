[package]
name = "alkanes-jsonrpc"
version.workspace = true
edition = "2021"
authors = ["Alkanes Team"]
description = "Unified JSON-RPC reverse proxy server for alkanes ecosystem"
license = "MIT"

[[bin]]
name = "alkanes-jsonrpc"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.8", default-features = false, features = [
    # actix-web's default features minus `compress-zstd` and `http2`.
    # compress-zstd: nothing here uses the Compress middleware, and with it
    # actix-http decoded any request body sent with `Content-Encoding: zstd`
    # through zstd 0.13's stream::write::Decoder (RUSTSEC-2026-0403; zstd 0.13
    # also carries RUSTSEC-2026-0391/-0398/-0410). Such bodies now reach the
    # handler undecoded and fail to parse. http2: the server binds plain
    # HTTP/1.1 (`HttpServer::bind`), and `http2` is what links h2 0.3
    # (RUSTSEC-2026-0258, no 0.3 fix) into the binary, reachable through h2c
    # prior knowledge. Same choice as metashrew v9.1.0-rc.6.
    "macros", "compress-brotli", "compress-gzip", "cookies", "unicode", "compat",
] }
actix-cors = "0.7"
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
url = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
bitcoin = { workspace = true }
alkanes-support = { workspace = true }
alkanes-cli-common = { path = "../alkanes-cli-common", features = ["std"] }
alkanes-rpc-core = { path = "../alkanes-rpc-core", features = ["std"] }
async-trait = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
mlua = { version = "0.9", features = ["lua54", "async", "send", "vendored"] }
sha2 = { workspace = true }
moka = { version = "0.12", features = ["sync"] }

[dev-dependencies]
tempfile = "3.0"
