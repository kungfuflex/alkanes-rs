[package]
name = "protorune-support"
# Pinned, not workspace: this crate is in the indexer wasm's dependency graph, and the
# package version feeds rustc's -C metadata, so bumping it changes alkanes.wasm bytes.
# It moves only with an indexer release (see the workspace [workspace.package] note).
version = "3.0.0-rc.3"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitcoin = { workspace = true }
serde = { workspace = true }
ordinals = { workspace = true }
anyhow = { workspace = true }
metashrew-support = { workspace = true }
hex = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
bech32 = "0.11.0"

[build-dependencies]
prost-build = { workspace = true }
