syntax = "proto3";

package protorune;

message RuneId {
  uint32 height = 1;
  uint32 txindex = 2;
}

message ProtoruneRuneId {
  uint128 height = 1;
  uint128 txindex = 2;
}

message Rune {
  ProtoruneRuneId runeId = 1;
  string name = 2;
  uint32 divisibility = 3;
  uint32 spacers = 4;
  string symbol = 5;
}

message BalanceSheetItem {
  Rune rune = 1;
  uint128 balance = 2;
}

message BalanceSheet {
  repeated BalanceSheetItem entries = 1;
}

message Outpoint {
  bytes txid = 1;
  uint32 vout = 2;
}

message OutpointWithProtocol {
  bytes txid = 1;
  uint32 vout = 2;
  uint128 protocol = 3;
}
message Output {
  bytes script = 1;
  uint64 value = 2;
}

message OutpointResponse {
  BalanceSheet balances = 1;
  Outpoint outpoint = 2;
  Output output = 3;
  uint32 height = 4;
  uint32 txindex = 5;
}

message PaginationInput {
  uint32 start = 1;
  uint32 end = 2;
}

message WalletRequest {
  bytes wallet = 1;
}

message WalletResponse {
  repeated OutpointResponse outpoints = 1;
  BalanceSheet balances = 2;
}

message ProtorunesWalletRequest {
  bytes wallet = 1;
  uint128 protocol_tag = 2;
}

// protorunesbyoutpointcursor: stream one outpoint's balance sheet in bounded
// pages. Start with cursor = 0 and pass `next_cursor` back until it is 0.
message OutpointCursorRequest {
  bytes txid = 1;
  uint32 vout = 2;
  uint128 protocol = 3;
  // Index of the first stored balance-sheet entry to return (0 = the start).
  uint32 cursor = 4;
  // Most entries to return; 0, or anything above the server's page cap,
  // means the page cap.
  uint32 limit = 5;
}

message OutpointCursorResponse {
  // The outpoint, with `balances` holding only this page's entries.
  OutpointResponse outpoint = 1;
  // Number of entries stored in the outpoint's whole balance sheet.
  uint32 total_entries = 2;
  // Cursor for the next page, or 0 when this page reaches the end. A next
  // page never starts at 0, so 0 is unambiguous.
  uint32 next_cursor = 3;
}

// protorunesbyaddresscursor: stream every balance an address holds in bounded
// pages. Start with both cursors 0 and pass `next_outpoint_cursor` /
// `next_entry_cursor` back until `done`. One large outpoint can be split
// across pages: it then appears in each page with that page's slice of its
// balance sheet.
message ProtorunesWalletCursorRequest {
  bytes wallet = 1;
  uint128 protocol_tag = 2;
  // Index into the address's stored outpoint list (append-only, so it also
  // holds outpoints since spent; those are skipped).
  uint32 outpoint_cursor = 3;
  // Index of the first balance-sheet entry to read from the outpoint at
  // `outpoint_cursor` (0 = the start of its sheet).
  uint32 entry_cursor = 4;
  // Most balance-sheet entries to return across all outpoints in the page;
  // 0, or anything above the server's page cap, means the page cap.
  uint32 limit = 5;
}

message WalletCursorResponse {
  repeated OutpointResponse outpoints = 1;
  // Length of the address's stored outpoint list (spent outpoints included).
  uint32 total_outpoints = 2;
  uint32 next_outpoint_cursor = 3;
  uint32 next_entry_cursor = 4;
  // True when the walk has reached the end of the outpoint list. A page can
  // come back with no outpoints and done = false (e.g. a run of spent
  // outpoints); keep paging until done.
  bool done = 5;
}

message RunesByHeightRequest {
  uint64 height = 1;
}

message ProtorunesByHeightRequest {
  uint64 height = 1;
  uint128 protocol_tag = 2;
}

message RunesResponse {
  repeated Rune runes = 1;
}
message ProtoBurn {
  uint128 protocol_tag = 1;
  uint32 pointer = 2;
}

message uint128 {
  uint64 lo = 1;
  uint64 hi = 2;
}

message Clause {
  ProtoruneRuneId rune = 1;
  uint128 amount = 2;
}

message Predicate {
  repeated Clause clauses = 1;
}

message ProtoMessage {
  bytes calldata = 1;
  Predicate predicate = 2;
  uint32 pointer = 3;
  uint32 refund_pointer = 4;
}

message RuntimeInput {
  uint128 protocol_tag = 1;
}

message Runtime {
  BalanceSheet balances = 1;
}
