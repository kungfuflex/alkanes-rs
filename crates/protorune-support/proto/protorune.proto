syntax = "proto3";

package protorune;

message RuneId {
  uint32 height = 1;
  uint32 txindex = 2;
}

message ProtoruneRuneId {
  uint128 height = 1;
  uint128 txindex = 2;
}

message Rune {
  ProtoruneRuneId runeId = 1;
  string name = 2;
  uint32 divisibility = 3;
  uint32 spacers = 4;
  string symbol = 5;
}

message BalanceSheetItem {
  Rune rune = 1;
  uint128 balance = 2;
}

message BalanceSheet {
  repeated BalanceSheetItem entries = 1;
}

message Outpoint {
  bytes txid = 1;
  uint32 vout = 2;
}

message OutpointWithProtocol {
  bytes txid = 1;
  uint32 vout = 2;
  uint128 protocol = 3;
  // Optional balance-sheet pagination. Both default to 0, which preserves the
  // legacy request shape: offset 0 = first stored entry, limit 0 = the
  // server's per-view cap. A limit above the cap is clamped to it.
  uint32 offset = 4;
  uint32 limit = 5;
}
message Output {
  bytes script = 1;
  uint64 value = 2;
}

message OutpointResponse {
  BalanceSheet balances = 1;
  Outpoint outpoint = 2;
  Output output = 3;
  uint32 height = 4;
  uint32 txindex = 5;
  // Number of entries stored in the outpoint's balance sheet, regardless of
  // how many were returned in `balances`.
  uint32 total_entries = 6;
  // Offset to pass to fetch the next page, or 0 when `balances` reaches the
  // end of the sheet. A next page never starts at 0, so 0 is unambiguous.
  uint32 next_offset = 7;
}

message PaginationInput {
  uint32 start = 1;
  uint32 end = 2;
}

message WalletRequest {
  bytes wallet = 1;
  // Optional pagination over the address's stored outpoint list, which is
  // append-only and so includes outpoints since spent. Both default to 0,
  // which preserves the legacy request shape: offset 0 = first stored
  // outpoint, limit 0 = the server's per-view scan cap. A limit above the cap
  // is clamped to it. The server may also end a page early once it has loaded
  // its per-view budget of balance-sheet entries.
  uint32 offset = 2;
  uint32 limit = 3;
}

message WalletResponse {
  repeated OutpointResponse outpoints = 1;
  BalanceSheet balances = 2;
  // Length of the address's stored outpoint list (spent outpoints included).
  uint32 total_outpoints = 3;
  // Offset to pass to fetch the next page, or 0 when this page reaches the
  // end of the list. Keep paging while it is nonzero: a page can come back
  // with no outpoints if every one it scanned was spent.
  uint32 next_offset = 4;
}

message ProtorunesWalletRequest {
  bytes wallet = 1;
  uint128 protocol_tag = 2;
  // Optional pagination over the address's stored outpoint list, which is
  // append-only and so includes outpoints since spent. Both default to 0,
  // which preserves the legacy request shape: offset 0 = first stored
  // outpoint, limit 0 = the server's per-view scan cap. A limit above the cap
  // is clamped to it. The server may also end a page early once it has loaded
  // its per-view budget of balance-sheet entries.
  uint32 offset = 3;
  uint32 limit = 4;
}

message RunesByHeightRequest {
  uint64 height = 1;
}

message ProtorunesByHeightRequest {
  uint64 height = 1;
  uint128 protocol_tag = 2;
}

message RunesResponse {
  repeated Rune runes = 1;
}
message ProtoBurn {
  uint128 protocol_tag = 1;
  uint32 pointer = 2;
}

message uint128 {
  uint64 lo = 1;
  uint64 hi = 2;
}

message Clause {
  ProtoruneRuneId rune = 1;
  uint128 amount = 2;
}

message Predicate {
  repeated Clause clauses = 1;
}

message ProtoMessage {
  bytes calldata = 1;
  Predicate predicate = 2;
  uint32 pointer = 3;
  uint32 refund_pointer = 4;
}

message RuntimeInput {
  uint128 protocol_tag = 1;
}

message Runtime {
  BalanceSheet balances = 1;
}
