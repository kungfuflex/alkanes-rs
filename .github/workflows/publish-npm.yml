name: Publish TypeScript SDK

# Build and publish are SEPARATE JOBS (audit 2026-10-12, finding 6 / close item 9).
#
#   build    no id-token, no secrets. Installs the SDK's npm tree, runs
#            wasm-pack (every crate's build script and proc macro), vendors the
#            contract wasms, compiles the TypeScript, packs the tarball and
#            uploads it as an artifact together with its sha256.
#   publish  id-token: write, `environment: sdk-publish` (limited to `develop`;
#            CLOUDFLARE_API_TOKEN lives there). Downloads the tarball, checks its
#            sha256 against the build job's output, signs in to GCP and runs
#            `npm publish <tarball> --ignore-scripts`. No checkout, no install,
#            no build: no third-party package code runs next to the credentials.
#
# Before this split, one job held `id-token: write` from the first step and
# was signed in to gcloud before `npm ci` (597 packages) and `wasm-pack build`
# ran, so any of them could mint a registry token. Reordering steps does not
# fix that; separate jobs do (a job's runner, environment and OIDC permission
# are its own).
#
# Third-party actions are pinned by commit SHA (tag in the trailing comment).
# Every downloaded tool is checked against a pinned sha256 (wasm-pack), or
# installed from crates.io with `--locked`, where cargo verifies each crate's
# checksum (wasm-bindgen-cli, which wasm-pack would otherwise download from
# GitHub unverified).

on:
  push:
    branches:
      - develop
    paths:
      - 'ts-sdk/**'
      - 'crates/alkanes-web-sys/**'
      # alkanes-cli-common is compiled INTO the web-sys WASM (provider, UTXO
      # selection, execute) — changes to it change the published artifact.
      # Missing from these triggers until 2026-07-11, so pure cli-common fixes
      # silently shipped no new SDK.
      - 'crates/alkanes-cli-common/**'
      - 'prod_wasms/**'
      - '.github/workflows/publish-npm.yml'
  # Build-only dry run on PRs into develop: the test gate and the build job run
  # (no secrets, no id-token, read-only token, as for every pull_request run);
  # the publish job is skipped by its `if:`. This is how a change to the build
  # is checked before it can publish anything.
  #
  # (The old `pull_request: [closed]` trigger, removed 2026-08-06, published a
  # second, different tarball for every merge; this trigger never publishes.)
  pull_request:
    branches:
      - develop
    paths:
      - 'ts-sdk/**'
      - 'crates/alkanes-web-sys/**'
      - 'crates/alkanes-cli-common/**'
      - 'prod_wasms/**'
      - '.github/workflows/publish-npm.yml'

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

env:
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'
  WASM_PACK_VERSION: '0.13.1'
  # sha256 of wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz from the
  # GitHub release (the release publishes no digest; recorded 2026-10-12 and
  # identical from two networks). Change it together with WASM_PACK_VERSION.
  WASM_PACK_SHA256: 'c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539'
  REGISTRY_URL: 'https://us-central1-npm.pkg.dev/pkg-alkanes-build/npm-packages/'

jobs:
  # Publishing gate. alkanes-cli-common is compiled into the web-sys WASM that
  # ships in this package, so a broken crate must not reach the registry: every
  # published tag is immutable (#286) and cannot be taken back, only superseded.
  test:
    name: Test (publish gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-
      # --lib only, deliberately: the integration targets under
      # crates/alkanes-cli-common/tests/ have bit-rotted (struct fields added
      # without updating callers, `alkanes::protorunes` items moved) and do not
      # compile; half that directory is already parked as *.rs.bak. Un-rotting
      # them is separate work. --lib still compiles src/mock_provider.rs and
      # runs the crate's unit tests, which is what this gate needs.
      - name: Test alkanes-cli-common
        run: cargo test -p alkanes-cli-common --lib --target x86_64-unknown-linux-gnu

  build:
    name: Build SDK tarball (no credentials)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/alkanes-web-sys/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      # Pinned version AND pinned sha256: the tarball is checked before it is
      # unpacked, so a swapped release asset fails the run here.
      - name: Install wasm-pack
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/wasm-pack"
          mkdir -p "$T"
          curl -sSfL -o "$T/wasm-pack.tar.gz" \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  $T/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf "$T/wasm-pack.tar.gz" -C "$T"
          sudo install -m 0755 "$T/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          test "$(wasm-pack --version)" = "wasm-pack ${WASM_PACK_VERSION}" || { wasm-pack --version; echo "wasm-pack version mismatch"; exit 1; }

      # wasm-pack downloads a wasm-bindgen binary from GitHub (no checksum)
      # unless one of the version in Cargo.lock is already on PATH. Install it
      # from crates.io instead: cargo verifies every crate against the index
      # checksum, and --locked uses the crate's own lockfile. Run outside the
      # repo so rust-toolchain.toml (1.86.0) does not apply to the install.
      - name: Install wasm-bindgen-cli (checksummed, from crates.io)
        run: |
          set -euo pipefail
          WBG=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          echo "wasm-bindgen in Cargo.lock: ${WBG}"
          test -n "$WBG"
          (cd "$RUNNER_TEMP" && cargo install wasm-bindgen-cli --version "$WBG" --locked)
          wasm-bindgen --version

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'ts-sdk/package-lock.json'

      - name: Generate version
        id: version
        run: |
          # Get base version from package.json
          BASE_VERSION=$(node -p "require('./ts-sdk/package.json').version")
          SHORT_SHA="${GITHUB_SHA::7}"
          # IMMUTABLE PUBLISH (#286): the commit sha alone is NOT build-unique —
          # rebuilding/republishing the same commit reused the SAME version tag
          # (0.1.6-<sha>) with different bytes, so warm pnpm/CI caches served the
          # stale artifact forever under an immutable-looking label. Append the
          # monotonic CI run number so every publish is a DISTINCT tag that is
          # never overwritten; a rebuild of the same source is opt-in via the new
          # suffix (e.g. 0.1.6-<sha>.<run>). Consumers pin bytes, not a moving tag.
          VERSION="${BASE_VERSION}-${SHORT_SHA}.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generated version: ${VERSION}"

      - name: Update package.json version
        working-directory: ts-sdk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # No --allow-same-version: each version is build-unique (#286), so a
          # collision here means an unexpected re-publish and SHOULD fail loudly.
          npm version "$VERSION" --no-git-tag-version
          grep '"version"' package.json

      - name: Install dependencies
        working-directory: ts-sdk
        run: npm ci

      - name: Build WASM from alkanes-web-sys
        working-directory: crates/alkanes-web-sys
        run: |
          wasm-pack build --target bundler --out-dir ../../ts-sdk/build/wasm
          cp -r ../../ts-sdk/build/wasm/* ../../ts-sdk/wasm/
          rm -f ../../ts-sdk/wasm/.gitignore ../../ts-sdk/wasm/.npmignore
          ls -lh ../../ts-sdk/wasm/

      - name: Vendor production WASMs
        working-directory: ts-sdk
        run: |
          npm run build:vendor
          ls -lh build/contracts/ | head -20

      - name: Build TypeScript SDK
        working-directory: ts-sdk
        run: |
          npm run build:ts
          ls -lh dist/

      # The tarball packed here is the exact file the publish job uploads
      # (`npm publish <tarball>`), so its sha256 is the published artifact's.
      - name: Pack tarball
        id: pack
        working-directory: ts-sdk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh wasm/alkanes_web_sys_bg.wasm
          mkdir -p "$RUNNER_TEMP/pkg"
          TARBALL=$(npm pack --silent --pack-destination "$RUNNER_TEMP/pkg" | tail -1)
          SHA256=$(sha256sum "$RUNNER_TEMP/pkg/$TARBALL" | cut -d' ' -f1)
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          # Content-address the artifact (#286): tag -> commit -> sha256.
          cat > "$RUNNER_TEMP/pkg/${VERSION}.json" <<EOF
          {
            "package": "@alkanes/ts-sdk",
            "version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "run": "${GITHUB_RUN_NUMBER}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tarball": "${TARBALL}",
            "sha256": "${SHA256}"
          }
          EOF
          cat "$RUNNER_TEMP/pkg/${VERSION}.json"
          tar -tzf "$RUNNER_TEMP/pkg/$TARBALL" | head -40

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/pkg/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-manifest-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/pkg/*.json
          if-no-files-found: error

  publish:
    name: Publish (sdk-publish environment)
    needs: build
    # Only a push to develop publishes. PR runs stop after `build`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: sdk-publish
    permissions:
      id-token: write # Workload Identity; this job only
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}
      SHA256: ${{ needs.build.outputs.sha256 }}

    steps:
      - name: Install Node.js (npm client only; no install, no cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/pkg

      - name: Verify tarball sha256
        working-directory: ${{ runner.temp }}/pkg
        run: |
          set -euo pipefail
          test -n "$TARBALL" && test -n "$SHA256"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          create_credentials_file: false
          export_environment_variables: false

      # The registry token goes into a user npmrc in RUNNER_TEMP (not into the
      # workspace), straight from the auth step's output; gcloud is not installed.
      - name: Configure npm authentication
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          NPMRC="$RUNNER_TEMP/publish.npmrc"
          REG="${REGISTRY_URL#https:}"
          umask 077
          {
            echo "@alkanes:registry=${REGISTRY_URL}"
            echo "${REG}:_authToken=${ACCESS_TOKEN}"
            echo "${REG}:always-auth=true"
          } > "$NPMRC"
          echo "NPM_CONFIG_USERCONFIG=$NPMRC" >> "$GITHUB_ENV"

      # Publishing a tarball runs no lifecycle scripts; --ignore-scripts makes
      # that explicit. The working directory holds only the downloaded files.
      - name: Publish to Artifact Registry
        working-directory: ${{ runner.temp }}/pkg
        run: |
          echo "Publishing @alkanes/ts-sdk@${VERSION} (${TARBALL}, sha256 ${SHA256})"
          npm publish "./${TARBALL}" --registry="${REGISTRY_URL}" --access=public --ignore-scripts

      # NOT continue-on-error. The dist-tag IS the thing consumers resolve; a
      # silent failure here leaves `latest-dev` pointing at an older build while
      # the run still reports success, which is exactly how the tag drifted away
      # from the newest publish unnoticed. If tagging fails, the run must go red.
      - name: Tag as latest-dev
        working-directory: ${{ runner.temp }}
        run: |
          npm dist-tag add "@alkanes/ts-sdk@${VERSION}" latest-dev --registry="${REGISTRY_URL}"

      - name: Purge CloudFlare cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=alkanes.build" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')
          echo "Zone ID: ${ZONE_ID}"
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "files": [
                "https://pkg.alkanes.build/dist/@alkanes/ts-sdk",
                "https://pkg.alkanes.build/@alkanes/ts-sdk",
                "https://pkg.alkanes.build/versions/@alkanes/ts-sdk"
              ]
            }')
          echo "Purge response: ${RESPONSE}"
          if echo "$RESPONSE" | jq -e '.success == true' > /dev/null; then
            echo "CloudFlare cache purged successfully"
          else
            echo "Cache purge failed, check CLOUDFLARE_API_TOKEN permissions"
            echo "Token needs 'Zone.Cache Purge' permission in CloudFlare dashboard"
          fi

      - name: Create summary
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## TypeScript SDK Published

          **Version:** \`${VERSION}\`
          **Commit:** \`${SHORT_SHA}\`
          **Tarball sha256:** \`${SHA256}\`
          **Registry:** [Google Artifact Registry](https://console.cloud.google.com/artifacts/npm/pkg-alkanes-build/us-central1/npm-packages/@alkanes/ts-sdk?project=pkg-alkanes-build)

          ### Installation (pin the exact version)

          \`\`\`bash
          pnpm install --save-dev 'https://pkg.alkanes.build/dist/@alkanes/ts-sdk?v=${VERSION}'
          \`\`\`

          pnpm records no integrity for a tarball URL: add the sha512 of this
          tarball to the lockfile by hand and install with \`--frozen-lockfile\`.

          ### Query Package Info

          \`\`\`bash
          curl https://pkg.alkanes.build/@alkanes/ts-sdk
          curl https://pkg.alkanes.build/versions/@alkanes/ts-sdk
          \`\`\`
          EOF
