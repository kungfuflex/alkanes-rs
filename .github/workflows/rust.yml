name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  marketplace-canonical-producer:
    name: Marketplace canonical producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0
      - name: Test canonical producer
        run: cargo test -p alkanes-contract-indexer
      - name: Test canonical transforms
        run: cargo test -p alkanes-trace-transform --lib
      - name: Check producer binaries
        run: cargo check -p alkanes-contract-indexer --bins

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-config:
          - name: "WASM Tests"
            command: "cargo test --target wasm32-unknown-unknown --features test-utils"
          - name: "Protorunes WASM Tests"
            command: "cargo test -p protorune --features test-utils"
          - name: "Protorune Unit Tests"
            command: "cargo test -p protorune --target x86_64-unknown-linux-gnu"
      fail-fast: false # Allows all tests to run even if one fails

    name: ${{ matrix.test-config.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install test runner
        run: cargo install wasm-bindgen-cli --version 0.2.100
      - name: ${{ matrix.test-config.name }}
        run: ${{ matrix.test-config.command }}
