[contract]
name = "Dsigil"

# Deliberately no opcode 1. The canonical auth token puts `authenticate` there,
# and that callback is the thing that inflates the supply. There is nothing to
# call here.
[opcodes]
initialize = 0
get-name = 99
get-symbol = 100
get-total-supply = 101

[views]
get-name = true
get-symbol = true
get-total-supply = true
