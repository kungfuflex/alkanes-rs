[package]
name = "alkanes-std-firevector"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The VM core deliberately depends on nothing but anyhow, so `cargo test -p
# alkanes-std-firevector` runs natively without a wasm toolchain and without
# pulling in the runtime. The alkane surface goes behind the `alkane` feature.
[dependencies]
anyhow = { workspace = true }
alkanes-runtime = { workspace = true, optional = true }
alkanes-support = { workspace = true, optional = true }
metashrew-support = { workspace = true, optional = true }

[features]
default = []
alkane = ["alkanes-runtime", "alkanes-support", "metashrew-support"]

# alkanes-support only, and only for tests: the cellpack-layout tests decode
# with the REAL CellpackDecode rather than a local mirror that would just agree
# with my misunderstanding of the wire format.
[dev-dependencies]
alkanes-support = { workspace = true }

[build-dependencies]
alkanes-wit-build = { path = "../../crates/alkanes-wit-build" }
