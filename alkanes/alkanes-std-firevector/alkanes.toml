[contract]
name = "Firevector"

[opcodes]
initialize = 0
evaluate = 1
simulate = 2
disassemble-program = 3
validate-program = 4
set-weightmap = 10
get-weightmap = 11
get-weightmap-mode = 12
get-sigil = 13
claim-vector-orbital = 14
get-claim-authority = 15
get-name = 99
get-symbol = 100

# The evaluator methods (1-4) are pure: no storage, no state. Only the
# governance surface (0, 10-13) touches storage, and only opcode 10 writes.
#
# The weightmap lives HERE rather than in DIESEL's storage, which is what keeps
# the DIESEL contract unmodified forever — no second fuel-affecting height gate
# for a setter it would otherwise need.
[views]
get-weightmap = true
get-weightmap-mode = true
get-sigil = true
get-claim-authority = true
evaluate = true
simulate = true
disassemble-program = true
validate-program = true
get-name = true
get-symbol = true
